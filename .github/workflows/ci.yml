name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Small dataset for tests
        run: |
          python -c "from src.data_generator import MineDataGenerator; g=MineDataGenerator(); g.n_samples=500; g.save('data/raw/mine_sensor_data.csv')"
      - name: Run tests
        run: pytest tests/ -v